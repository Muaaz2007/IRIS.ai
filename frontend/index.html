<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23C96442'/%3E%3Ctext x='16' y='22' font-family='Georgia, serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EIR%3C/text%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IRIS.ai — Ollama-powered chat, guarded by the IRIS security and ML layers." />
    <title>IRIS.ai</title>
    <script>
      /* Set theme class before first paint to avoid a flash of wrong theme. */
      (function () {
        try {
          var t = localStorage.getItem('iris.theme');
          if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
